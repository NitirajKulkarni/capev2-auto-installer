[kvm]
# Specify a comma-separated list of available machines to be used.
machines = {{VM_NAME}}

# Default network interface used by the machines for packet capture.
interface = {{CAPE_INTERFACE}}

# Libvirt connection URI. Leave empty for default local QEMU/KVM connection.
dsn =

[{{VM_NAME}}]
# Machine label in libvirt.
label = {{VM_NAME}}

# Operating system platform running in guest.
platform = {{PLATFORM}}

# IP address assigned to guest.
ip = {{VM_IP}}

# Snapshot name restored prior to analysis.
snapshot = {{SNAPSHOT_NAME}}

# Network interface for this VM (empty inherits [kvm] interface).
interface =

# Resultserver IP and port reachable from the guest.
resultserver_ip = {{RESULT_SERVER_IP}}
resultserver_port = 2042

# Optional tags.
tags =
